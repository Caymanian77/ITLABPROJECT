<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VERIS Incident Search</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 40px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 30px;
    }

    #filters input,
    #filters select {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 200px;
    }

    #filters button {
      padding: 10px 15px;
      background-color: #3498db;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    #filters button:hover {
      background-color: #2980b9;
    }

    #results {
      margin: 40px auto 0;
      max-width: 900px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      overflow-y: auto;
    }

    .result-item {
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item strong {
      color: #2c3e50;
    }

    .result-item a {
      color: #2980b9;
      text-decoration: none;
    }

    .result-item a:hover {
      text-decoration: underline;
    }

    em {
      color: #888;
    }

    @media (max-width: 600px) {
      #filters {
        flex-direction: column;
        align-items: center;
      }

      #filters input,
      #filters select,
      #filters button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>🔍 VERIS Incident Search</h1>

  <div id="filters">
    <input type="text" id="searchBox" placeholder="Search anything...">

    <select id="actorFilter">
      <option value="">Actor Variety</option>
    </select>

    <select id="actionFilter">
      <option value="">Action Variety</option>
    </select>

    <select id="assetFilter">
      <option value="">Asset Variety</option>
    </select>

    <button onclick="search()">Search</button>
  </div>

  <div id="results">
    <em>Results will appear here...</em>
  </div>

  <script>
    const API_BASE = "https://itlabbackend.onrender.com";

    async function search() {
      const query = document.getElementById("searchBox").value;
      const actor = document.getElementById("actorFilter").value;
      const action = document.getElementById("actionFilter").value;
      const asset = document.getElementById("assetFilter").value;

      const params = new URLSearchParams({ q: query, actor, action, asset });

      const response = await fetch(`${API_BASE}/search?${params.toString()}`);
      const data = await response.json();

      const resultsBox = document.getElementById("results");
      resultsBox.innerHTML = "";

      if (!data.length) {
        resultsBox.innerHTML = "<em>No results found.</em>";
        return;
      }

      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "result-item";

        div.innerHTML = `
          <strong>Summary:</strong> ${item.summary || "N/A"}<br>
          <strong>Incident ID:</strong> ${item.incident_id || "N/A"}<br>
          <strong>Victim Country:</strong> ${item.victim?.country?.join(", ") || "N/A"}<br>
          <strong>Victim Industry:</strong> ${item.victim?.industry || "N/A"}<br>
          <strong>Actor (External):</strong> ${item.actor?.external?.variety?.join(", ") || "N/A"}<br>
          <strong>Actor (Internal):</strong> ${item.actor?.internal?.variety?.join(", ") || "N/A"}<br>
          <strong>Actions:</strong> ${[
            ...(item.action?.misuse?.variety || []),
            ...(item.action?.social?.variety || []),
            ...(item.action?.hacking?.variety || []),
            ...(item.action?.malware?.variety || []),
            ...(item.action?.physical?.variety || [])
          ].join(", ") || "N/A"}<br>
          <strong>Assets:</strong> ${item.asset?.assets?.map(a => a.variety).join(", ") || "N/A"}<br>
          <strong>Reference:</strong> <a href="${item.reference || '#'}" target="_blank">${item.reference || "N/A"}</a><br>
        `;

        resultsBox.appendChild(div);
      });
    }

    // Fetch filter values from backend
    window.onload = async function () {
      try {
        const res = await fetch(`${API_BASE}/filters`);
        if (!res.ok) throw new Error("Failed to load filters");
        const filters = await res.json();

        populateDropdown("actorFilter", filters.actors);
        populateDropdown("actionFilter", filters.actions);
        populateDropdown("assetFilter", filters.assets);
      } catch (e) {
        console.error("Filter load error:", e);
        alert("Failed to load dropdown filters. Check backend.");
      }
    };

    function populateDropdown(id, options) {
      const select = document.getElementById(id);
      options.forEach(opt => {
        const option = document.createElement("option");
        option.value = opt;
        option.textContent = opt;
        select.appendChild(option);
      });
    }
  </script>
</body>
</html>
