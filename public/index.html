<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VERIS Incident Search</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 40px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    #filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 30px auto;
      max-width: 800px;
      align-items: center;
    }

    #filters input,
    #filters select {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background-color: #fff;
      transition: border-color 0.3s ease;
    }

    #filters input:focus,
    #filters select:focus {
      border-color: #3498db;
      outline: none;
    }

    #filters button {
      padding: 10px 15px;
      background-color: #3498db;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s ease;
    }

    #filters button:hover {
      background-color: #2980b9;
    }

    #results {
      margin: 40px auto 0;
      max-width: 900px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      overflow-y: auto;
      max-height: 600px;
    }

    .result-item {
      border-bottom: 1px solid #e0e0e0;
      padding: 15px 0;
      line-height: 1.6;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item strong {
      color: #2c3e50;
    }

    .result-item a {
      color: #2980b9;
      text-decoration: none;
    }

    .result-item a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }

      #filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>🔍 VERIS Incident Search</h1>

  <div id="filters">
    <input type="text" id="searchBox" placeholder="Search anything...">

   <select id="actorFilter">
  <option value="">Actor Variety</option>
  <option value="Unknown">Unknown</option>
  <option value="End-user">End-user</option>
</select>

<select id="actionFilter">
  <option value="">Action Variety</option>
  <option value="Privilege abuse">Privilege abuse</option>
  <option value="Bribery">Bribery</option>
</select>

<select id="assetFilter">
  <option value="">Asset Variety</option>
  <option value="S - Database">S - Database</option>
</select>
    <button onclick="search()">Search</button>
  </div>

  <div id="results">
    <em>Results will appear here...</em>
  </div>

  <script>
     async function search() {
    const query = document.getElementById("searchBox").value;
    const actor = document.getElementById("actorFilter").value;
    const action = document.getElementById("actionFilter").value;
    const asset = document.getElementById("assetFilter").value;

    const params = new URLSearchParams({ q: query, actor, action, asset });

    const response = await fetch(`https://itlabbackend.onrender.com/search?${params.toString()}`);
    const data = await response.json();

    const resultsBox = document.getElementById("results");
    resultsBox.innerHTML = "";

    if (!data.length) {
      resultsBox.innerHTML = "<em>No results found.</em>";
      return;
    }

    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "result-item";

      div.innerHTML = `
        <strong>Summary:</strong> ${item.summary || "N/A"}<br>
        <strong>Incident ID:</strong> ${item.incident_id || "N/A"}<br>
        <strong>Victim Name:</strong> ${item.victim?.name || "N/A"}<br>
        <strong>Victim Country:</strong> ${item.victim?.country || "N/A"}<br>
        <strong>Victim Industry:</strong> ${item.victim?.industry || "N/A"}<br>
        <strong>Confidence:</strong> ${item.confidence || "N/A"}<br>
        <strong>Targeted:</strong> ${item.targeted || "N/A"}<br>
        <strong>Reference:</strong> <a href="${item.reference || '#'}" target="_blank">${item.reference || "N/A"}</a>
      `;

      resultsBox.appendChild(div);
    });
  }

  // NEW: Populate filters on load
  window.onload = async function () {
    const res = await fetch("https://itlabbackend.onrender.com/filters");
    const filters = await res.json();

    populateDropdown("actorFilter", filters.actors);
    populateDropdown("actionFilter", filters.actions);
    populateDropdown("assetFilter", filters.assets);
  };

  function populateDropdown(id, options) {
    const select = document.getElementById(id);
    options.forEach(opt => {
      const option = document.createElement("option");
      option.value = opt;
      option.textContent = opt;
      select.appendChild(option);
    });
  }
</script>
  </script>
  
</body>
</html>
